<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Hub-and-spoke observability: Grafana Alloy agents on each AKS cluster ship metrics, logs and traces to a central Mimir, Loki and Tempo hub backed by Azure Blob storage, feeding Grafana dashboards, alerting and RCAs."><title>Hub-and-spoke observability: Grafana Alloy agents on each AKS cluster ship metrics, logs and traces to a central Mimir, Loki and Tempo hub backed by Azure Blob storage, feeding Grafana dashboards, alerting and RCAs.</title><style>
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
