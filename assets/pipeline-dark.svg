<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Self-healing delivery pipeline: commit, test with SonarQube, Trivy scan, build, Argo CD canary deploy, observe with Prometheus, Loki and Tempo, then promote; an SLO breach triggers automatic rollback."><title>Self-healing delivery pipeline: commit, test with SonarQube, Trivy scan, build, Argo CD canary deploy, observe with Prometheus, Loki and Tempo, then promote; an SLO breach triggers automatic rollback.</title><style>
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .tx{fill:#e6edf3} .mu{fill:#8b949e} .ac{fill:#22d3ee} .ac2{fill:#a78bfa}
    .ok{fill:#3fb950} .wn{fill:#f0b429} .er{fill:#f85149} .bl{fill:#58a6ff}
    .card{fill:#161b22;stroke:#30363d;stroke-width:1}
    .card2{fill:#0f141b;stroke:#30363d;stroke-width:1}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes ring{0%{r:6;opacity:.7}100%{r:18;opacity:0}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .blink{animation:blink 1.1s step-end infinite}
    .rise{animation:rise .6s ease-out backwards}
    .flow{stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
    
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
    </style><rect x=".5" y=".5" width="1199" height="299" rx="16" class="card"/><text x="28" y="40" class="mono mu" font-size="13">pipeline / <tspan class="tx">self-healing-delivery</tspan></text><text x="1172" y="40" text-anchor="end" class="mono mu" font-size="12">every commit: gated, scanned, canaried, watched</text><path d="M26,129.0 H1176" stroke="#30363d" stroke-width="2"/><g class="rise" style="animation-delay:0.10s"><rect x="26" y="92" width="142" height="74" rx="12" class="card2"/><rect x="26" y="92" width="4" height="74" rx="2" fill="#8b949e"/><text x="99.0" y="124" text-anchor="middle" class="sans tx" font-size="16" font-weight="700">commit</text><text x="99.0" y="146" text-anchor="middle" class="mono mu" font-size="10.5">git push</text></g><path d="M177.0,124.0 l6,5 l-6,5" fill="none" stroke="#8b949e" stroke-width="1.6"/><g class="rise" style="animation-delay:0.22s"><rect x="194" y="92" width="142" height="74" rx="12" class="card2"/><rect x="194" y="92" width="4" height="74" rx="2" fill="#58a6ff"/><text x="267.0" y="124" text-anchor="middle" class="sans tx" font-size="16" font-weight="700">test</text><text x="267.0" y="146" text-anchor="middle" class="mono mu" font-size="10.5">pytest · SonarQube</text></g><path d="M345.0,124.0 l6,5 l-6,5" fill="none" stroke="#8b949e" stroke-width="1.6"/><g class="rise" style="animation-delay:0.34s"><rect x="362" y="92" width="142" height="74" rx="12" class="card2"/><rect x="362" y="92" width="4" height="74" rx="2" fill="#f0b429"/><text x="435.0" y="124" text-anchor="middle" class="sans tx" font-size="16" font-weight="700">scan</text><text x="435.0" y="146" text-anchor="middle" class="mono mu" font-size="10.5">Trivy CVE gate</text></g><path d="M513.0,124.0 l6,5 l-6,5" fill="none" stroke="#8b949e" stroke-width="1.6"/><g class="rise" style="animation-delay:0.46s"><rect x="530" y="92" width="142" height="74" rx="12" class="card2"/><rect x="530" y="92" width="4" height="74" rx="2" fill="#58a6ff"/><text x="603.0" y="124" text-anchor="middle" class="sans tx" font-size="16" font-weight="700">build</text><text x="603.0" y="146" text-anchor="middle" class="mono mu" font-size="10.5">multi-stage image</text></g><path d="M681.0,124.0 l6,5 l-6,5" fill="none" stroke="#8b949e" stroke-width="1.6"/><g class="rise" style="animation-delay:0.58s"><rect x="698" y="92" width="142" height="74" rx="12" class="card2"/><rect x="698" y="92" width="4" height="74" rx="2" fill="#a78bfa"/><text x="771.0" y="124" text-anchor="middle" class="sans tx" font-size="16" font-weight="700">deploy</text><text x="771.0" y="146" text-anchor="middle" class="mono mu" font-size="10.5">Argo CD · canary</text></g><path d="M849.0,124.0 l6,5 l-6,5" fill="none" stroke="#8b949e" stroke-width="1.6"/><g class="rise" style="animation-delay:0.70s"><rect x="866" y="92" width="142" height="74" rx="12" class="card2"/><rect x="866" y="92" width="4" height="74" rx="2" fill="#22d3ee"/><text x="939.0" y="124" text-anchor="middle" class="sans tx" font-size="16" font-weight="700">observe</text><text x="939.0" y="146" text-anchor="middle" class="mono mu" font-size="10.5">Prom · Loki · Tempo</text></g><path d="M1017.0,124.0 l6,5 l-6,5" fill="none" stroke="#8b949e" stroke-width="1.6"/><g class="rise" style="animation-delay:0.82s"><rect x="1034" y="92" width="142" height="74" rx="12" class="card2"/><rect x="1034" y="92" width="4" height="74" rx="2" fill="#3fb950"/><text x="1107.0" y="124" text-anchor="middle" class="sans tx" font-size="16" font-weight="700">live</text><text x="1107.0" y="146" text-anchor="middle" class="mono mu" font-size="10.5">promoted</text></g><circle r="5" class="ac"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M26,129.0 H1176"/><animate attributeName="opacity" dur="6s" begin="0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.05;.92;1"/></circle><circle r="5" class="ac"><animateMotion dur="6s" begin="2s" repeatCount="indefinite" path="M26,129.0 H1176"/><animate attributeName="opacity" dur="6s" begin="2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.05;.92;1"/></circle><circle r="5" class="ac"><animateMotion dur="6s" begin="4s" repeatCount="indefinite" path="M26,129.0 H1176"/><animate attributeName="opacity" dur="6s" begin="4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.05;.92;1"/></circle><path d="M937.0,166 C937.0,236 769.0,236 769.0,170" fill="none" stroke="#f0b429" stroke-width="2" class="flow"/><path d="M764.0,178 l5,-8 l5,8" fill="none" stroke="#f0b429" stroke-width="2"/><circle r="5" class="wn"><animateMotion dur="4s" repeatCount="indefinite" path="M937.0,166 C937.0,236 769.0,236 769.0,170"/></circle><text x="853.0" y="248" text-anchor="middle" class="mono wn" font-size="12">SLO breach → automatic rollback</text><circle cx="33" cy="270" r="4" fill="#f0b429"/><text x="44" y="274" class="mono mu" font-size="11.5">security gates on every commit</text><circle cx="293.0" cy="270" r="4" fill="#a78bfa"/><text x="304.0" y="274" class="mono mu" font-size="11.5">canary traffic shifting</text><circle cx="502.6" cy="270" r="4" fill="#22d3ee"/><text x="513.6" y="274" class="mono mu" font-size="11.5">metrics · logs · traces</text></svg>