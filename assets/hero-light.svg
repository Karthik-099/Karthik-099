<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Karthik. DevOps, Platform and Site Reliability Engineer. Building reliable, observable and cost-efficient cloud infrastructure."><title>Karthik. DevOps, Platform and Site Reliability Engineer. Building reliable, observable and cost-efficient cloud infrastructure.</title><style>
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
