<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label=""><title></title><style>
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .tx{fill:#e6edf3} .mu{fill:#8b949e} .ac{fill:#22d3ee} .ac2{fill:#a78bfa}
    .ok{fill:#3fb950} .wn{fill:#f0b429} .er{fill:#f85149} .bl{fill:#58a6ff}
    .card{fill:#161b22;stroke:#30363d;stroke-width:1}
    .card2{fill:#0f141b;stroke:#30363d;stroke-width:1}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes ring{0%{r:6;opacity:.7}100%{r:18;opacity:0}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .blink{animation:blink 1.1s step-end infinite}
    .rise{animation:rise .6s ease-out backwards}
    .flow{stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
    
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
    </style><defs><linearGradient id="d" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".6"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs><rect x="0" y="11" width="1200" height="2" fill="url(#d)"/><circle cy="12" r="3.5" class="ac"><animate attributeName="cx" dur="7s" repeatCount="indefinite" values="80;1120;80"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values=".2;1;.2;1;.2"/></circle></svg>